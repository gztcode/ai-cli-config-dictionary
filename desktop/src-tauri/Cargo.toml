[package]
name = "cfg-explorer-desktop"
version = "0.1.0"
description = "AI CLI 配置字典 · 桌面应用"
authors = ["cfg-explorer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cfg_explorer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfg-explorer = { path = "../.." }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
